name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Fmt, clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 🔑 TWO toolchains on purpose. rustfmt.toml sets options that only
      # nightly rustfmt understands, so fmt runs on nightly; clippy and the
      # tests run on stable, which is what consumers build with.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add clippy --toolchain stable
          rustup component add rustfmt --toolchain nightly
          rustup default stable
        shell: bash

      - uses: Swatinem/rust-cache@v2

      # 🪤 NIGHTLY, not stable. Six of rustfmt.toml's options are nightly-only
      # (wrap_comments, format_code_in_doc_comments, comment_width,
      # imports_layout, imports_granularity, match_arm_blocks). Stable rustfmt
      # does not fail on them -- it prints "can't set ..., unstable features
      # are only available in nightly channel" for each and formats to a
      # weaker standard, exit 0. So a stable leg passed while enforcing
      # something the config never asked for.
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      # 🪤 `-D clippy::pedantic` ALONE would leave default-level lints as mere
      # warnings, so both flags are needed. The crate is pedantic-clean by
      # hand; without this it stays that way only until someone forgets.
      # README.md quotes this command -- keep the two in step.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -D clippy::pedantic

      - name: Test
        run: cargo test
