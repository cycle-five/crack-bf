[package]
name = "crack-bf"
version = "0.1.0"
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "Brainfuck interpreter for cracktunes."
# 🪤 crates.io caps this at FIVE keywords, each ASCII alphanumeric plus
# `_`/`-`/`+` and at most 20 characters -- no spaces. `cargo package` does not
# check either rule; the rejection only arrives at `cargo publish`, and
# `publish = true` above means that day will come.
keywords = [
  "brainfuck",
  "esolang",
  "interpreter",
  "compiler",
  "discord",
]
# Must be a real crates.io category slug, likewise unvalidated until publish.
categories = ["compilers"]
homepage = "https://cracktun.es/"
repository = "https://github.com/cycle-five/crack-bf"


[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
